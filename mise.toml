# Project toolchain and task definitions for woodchipper.
# Node 24 is the general ~/github/stuffbucket baseline; pnpm matches package.json's `packageManager`.
# Temurin JDK 21 powers headless Ghidra 12.1.4 for REA (`rea-agents@6.7.0`).

[tools]
node = "24.22.1"
pnpm = "12.11.2"
python = "3.12.15"
java = "temurin-21.0.12+101.0.LTS"

[env]
GHIDRA_INSTALL_DIR = "{{env.HOME}}/.local/share/ghidra/ghidra_12.1.4_PUBLIC"
JAVA_HOME = "{{env.HOME}}/.local/share/mise/installs/java/temurin-21.0.12+101.0.LTS"
GHIDRA_HEADLESS_MAXMEM = "4G"
COREPACK_NPM_REGISTRY = "https://packagefeedproxy.microsoft.io/npm/"
NPM_CONFIG_REGISTRY = "https://packagefeedproxy.microsoft.io/npm/"
PNPM_CONFIG_REGISTRY = "https://packagefeedproxy.microsoft.io/npm/"

[settings]
lockfile = true

[tasks.start]
description = "Single-command launcher: auto-bootstraps setup on first run if needed and opens the Woodchipper TUI"
run = "./woodchipper"

[tasks.setup]
description = "Build isolated dependency overrides, install dependencies, and build the project-local vendored Pi harness"
run = "pnpm run setup"

[tasks."build:overrides"]
description = "Build temporary jose and fast-uri override packages in Docker"
run = "pnpm run build:overrides"

[tasks."build:pi"]
description = "Build audited Pi runtime from the pinned vendor/pi source through the configured proxy"
run = "pnpm run build:pi"

[tasks."build:harness"]
description = "Verify and build the customized Woodchipper Pi harness (pass --with-submodule-build to stage the audited Pi runtime)"
run = "pnpm run build:harness"

[tasks.site]
description = "Run the Woodchipper documentation site locally"
run = "pnpm run site"

[tasks."site:build"]
description = "Build the Woodchipper documentation site"
run = "pnpm run site:build"

[tasks.tui]
description = "Launch the interactive Woodchipper Pi TUI (with live Claude Code peerProtocol:1 A2A socket active)"
run = "pnpm run woodchipper -- tui"

[tasks.daemon]
description = "Run headless Woodchipper Pi peer daemon listening for Claude Code SendMessage or woodchipper-ctl"
run = "pnpm run daemon"

[tasks.ctl]
description = "Control or message Woodchipper / Claude Code peers: mise run ctl -- [peers|status|ledger|send]"
run = "pnpm run ctl --"

[tasks.clean]
description = "Inspect or clean REA/Ghidra caches, temp dirs, Docker build cache, GLiNER models, or inactive workspaces"
run = "pnpm run clean"

[tasks.validate]
description = "Validate Woodchipper skills, workflows, Pi harness extensions, and vendor manifest"
run = "pnpm run validate"

[tasks.test]
description = "Run the Woodchipper node:test validation suite"
run = "pnpm test"

[tasks."test:mutate"]
description = "Run the Woodchipper security & logic mutation test suite"
run = "pnpm run test:mutate"

[tasks.smoke]
description = "Run end-to-end Woodchipper smoke test against tests/fixtures/sample-electron-app"
run = "pnpm run smoke"

[tasks.doctor]
description = "Run REA environment and external tool readiness check (Ghidra 12.1.4 + Skill Identity)"
run = "pnpm run doctor"

[tasks.rea]
description = "Invoke the local rea CLI directly: mise run rea -- <subcommand> [args]"
run = "pnpm exec rea"

[tasks."sync:skills"]
description = "Sync skills/woodchipper* into ../skills/plugins/stuffbucket/skills"
run = "pnpm run sync:skills"

[tasks."update:vendor"]
description = "Refresh vendor/ from upstream morluto/rea and JoasASantos/REA-Prompts"
run = "pnpm run update:vendor"
